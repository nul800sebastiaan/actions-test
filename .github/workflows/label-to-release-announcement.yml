name: Auto-create Release Discussion

on:
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]

jobs:
  create-discussion:
    if: startsWith(github.event.label.name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from label
        id: extract
        run: |
          LABEL_NAME="${{ github.event.label.name }}"
          VERSION="${LABEL_NAME#release/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Discussion if missing
        id: discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          LABEL="release/$VERSION"

          echo "Checking for existing discussion with label $LABEL..."

          EXISTING=$(gh api graphql -f query='
            query($repo: String!, $owner: String!, $label: [String!]) {
              repository(name: $repo, owner: $owner) {
                discussions(labels: $label, first: 1) {
                  nodes { id url }
                }
              }
            }' \
            -F owner=${{ github.repository_owner }} \
            -F repo=${{ github.event.repository.name }} \
            -F label="$LABEL" \
            --jq '.data.repository.discussions.nodes[0].id')

          if [ -n "$EXISTING" ]; then
            echo "Discussion already exists"
            echo "discussionId=$EXISTING" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Creating new discussion for $VERSION..."

          REPO_ID=$(gh api graphql -f query='
            query($repo: String!, $owner: String!) {
              repository(name: $repo, owner: $owner) { id }
            }' \
            -F owner=${{ github.repository_owner }} \
            -F repo=${{ github.event.repository.name }} \
            --jq '.data.repository.id')

          CATEGORY_ID=$(gh api graphql -f query='
            query($repo: String!, $owner: String!) {
              repository(name: $repo, owner: $owner) {
                discussionCategories(first: 20) {
                  nodes { id name }
                }
              }
            }' \
            -F owner=${{ github.repository_owner }} \
            -F repo=${{ github.event.repository.name }} \
            --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')

          DISCUSSION_ID=$(gh api graphql -f query='
            mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
              createDiscussion(input: {
                repositoryId: $repo,
                categoryId: $cat,
                title: $title,
                body: $body
              }) {
                discussion { id url }
              }
            }' \
            -F repo=$REPO_ID \
            -F cat=$CATEGORY_ID \
            -F title="Release: $VERSION" \
            -F body="**Release version:** $VERSION\n**Release date:** TODO (YYYY-MM-DD)\n**Status:** TODO\n\n### Highlights\n\n### Community contributions\n\n### Links\n- [Pull requests with $LABEL](https://github.com/${{ github.repository }}/pulls?q=label%3A$LABEL)" \
            --jq '.data.createDiscussion.discussion.id')

          echo "discussionId=$DISCUSSION_ID" >> $GITHUB_OUTPUT

      - name: Add label to discussion
        if: steps.discussion.outputs.discussionId != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          LABEL="release/$VERSION"
          DISCUSSION_ID="${{ steps.discussion.outputs.discussionId }}"

          echo "Ensuring label $LABEL exists..."
          gh api repos/${{ github.repository }}/labels/$LABEL || \
            gh api repos/${{ github.repository }}/labels -f name="$LABEL" -f color="0E8A16"

          echo "Adding label $LABEL to discussion $DISCUSSION_ID..."
          gh api graphql -f query='
            mutation($id:ID!, $labels:[String!]!) {
              addLabelsToLabelable(input: {labelableId:$id, labelIds:[] , labelNames:$labels}) {
                clientMutationId
              }
            }' \
            -F id=$DISCUSSION_ID \
            -F labels="[$LABEL]"
