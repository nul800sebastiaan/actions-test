name: Auto-create Release Discussion

on:
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]

jobs:
  create-discussion:
    if: startsWith(github.event.label.name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from label
        id: extract
        run: |
          LABEL_NAME="${{ github.event.label.name }}"
          VERSION="${LABEL_NAME#release/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check or create Discussion
        id: discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          LABEL="release/$VERSION"

          echo "Looking for existing discussion in Announcements with label $LABEL..."
          DISCUSSION_ID=""
          CURSOR="null"

          while true; do
            PAGE=$(gh api graphql -f query='
              query($repo: String!, $owner: String!, $cursor: String) {
                repository(name: $repo, owner: $owner) {
                  discussions(first: 50, after: $cursor) {
                    nodes {
                      id
                      url
                      title
                      category { name }
                      labels(first: 20) { nodes { name } }
                    }
                    pageInfo {
                      hasNextPage
                      endCursor
                    }
                  }
                }
              }' \
              -F owner=${{ github.repository_owner }} \
              -F repo=${{ github.event.repository.name }} \
              -F cursor="$CURSOR")

            MATCH=$(echo "$PAGE" | jq -r --arg LABEL "$LABEL" '
              .data.repository.discussions.nodes[]
              | select(.category.name=="Announcements")
              | select(.labels.nodes[].name == $LABEL)
              | .id' | head -n1)

            if [ -n "$MATCH" ]; then
              DISCUSSION_ID="$MATCH"
              echo "Found existing discussion: $DISCUSSION_ID"
              break
            fi

            HAS_NEXT=$(echo "$PAGE" | jq -r '.data.repository.discussions.pageInfo.hasNextPage')
            if [ "$HAS_NEXT" != "true" ]; then
              break
            fi
            CURSOR=$(echo "$PAGE" | jq -r '.data.repository.discussions.pageInfo.endCursor')
          done

          if [ -n "$DISCUSSION_ID" ]; then
            echo "discussionId=$DISCUSSION_ID" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "No discussion found — creating one..."

          REPO_ID=$(gh api graphql -f query='
            query($repo: String!, $owner: String!) {
              repository(name: $repo, owner: $owner) { id }
            }' \
            -F owner=${{ github.repository_owner }} \
            -F repo=${{ github.event.repository.name }} \
            --jq '.data.repository.id')

          CATEGORY_ID=$(gh api graphql -f query='
            query($repo: String!, $owner: String!) {
              repository(name: $repo, owner: $owner) {
                discussionCategories(first: 50) {
                  nodes { id name }
                }
              }
            }' \
            -F owner=${{ github.repository_owner }} \
            -F repo=${{ github.event.repository.name }} \
            --jq '.data.repository.discussionCategories.nodes[] | select(.name=="Announcements") | .id')

          DISCUSSION_ID=$(gh api graphql -f query='
            mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
              createDiscussion(input: {
                repositoryId: $repo,
                categoryId: $cat,
                title: $title,
                body: $body
              }) {
                discussion { id url }
              }
            }' \
            -F repo=$REPO_ID \
            -F cat=$CATEGORY_ID \
            -F title="Release: $VERSION" \
            -F body="**Release version:** $VERSION\n**Release date:** TODO (YYYY-MM-DD)\n**Status:** TODO\n\n### Highlights\n\n### Community contributions\n\n### Links\n- [Pull requests with $LABEL](https://github.com/${{ github.repository }}/pulls?q=label%3A$LABEL)" \
            --jq '.data.createDiscussion.discussion.id')

          echo "discussionId=$DISCUSSION_ID" >> $GITHUB_OUTPUT

      - name: Add label to discussion
        if: steps.discussion.outputs.discussionId != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          LABEL="release/$VERSION"
          DISCUSSION_ID="${{ steps.discussion.outputs.discussionId }}"

          echo "Ensuring label $LABEL exists..."
          if ! gh api repos/${{ github.repository }}/labels/$LABEL > /dev/null 2>&1; then
            gh api repos/${{ github.repository }}/labels -f name="$LABEL" -f color="0E8A16"
          fi

          echo "Adding label $LABEL to discussion $DISCUSSION_ID..."
          gh api graphql -f query='
            mutation($id:ID!, $labels:[String!]!) {
              addLabelsToLabelable(input: {labelableId:$id, labelNames:$labels}) {
                clientMutationId
              }
            }' \
            -F id=$DISCUSSION_ID \
            -F labels="[$LABEL]"
