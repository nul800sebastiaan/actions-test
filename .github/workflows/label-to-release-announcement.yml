name: Label → Release Discussion

on:
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]

permissions:
  contents: read
  discussions: write
  issues: write        # needed to create labels
  pull-requests: read

jobs:
  create-discussion:
    if: startsWith(github.event.label.name, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse release Discussion (Announcements)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labelName = context.payload.label?.name;
            if (!labelName || !labelName.startsWith('release/')) {
              core.info('No release/* label, skipping.');
              return;
            }
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const version = labelName.substring('release/'.length);
            const categoryName = 'Announcements';

            core.info(`Repo: ${owner}/${repo}`);
            core.info(`Label: ${labelName}  Version: ${version}`);

            // 1) Get repo id + categories
            const repoData = await github.graphql(`
              query($owner:String!, $repo:String!){
                repository(owner:$owner, name:$repo){
                  id
                  discussionCategories(first:100){ nodes { id name } }
                }
              }
            `, { owner, repo });

            const repoId = repoData.repository.id;
            const category = repoData.repository.discussionCategories.nodes
              .find(c => c.name === categoryName);
            if (!category) {
              core.setFailed(`Discussion category "${categoryName}" not found`);
              return;
            }
            const categoryId = category.id;

            // 2) Scan discussions (paginated) to find existing one
            let cursor = null;
            let discussionId = null;
            const titleTarget = `Release: ${version}`;

            while (true) {
              const page = await github.graphql(`
                query($owner:String!, $repo:String!, $cursor:String){
                  repository(owner:$owner, name:$repo){
                    discussions(first:50, after:$cursor){
                      nodes{
                        id
                        title
                        url
                        category{ name }
                        labels(first:50){ nodes{ name } }
                      }
                      pageInfo{ hasNextPage endCursor }
                    }
                  }
                }
              `, { owner, repo, cursor });

              const nodes = page.repository.discussions.nodes;

              // match by category+label
              const byLabel = nodes.find(d =>
                d.category?.name === categoryName &&
                d.labels?.nodes?.some(l => l.name === labelName)
              );
              if (byLabel) { discussionId = byLabel.id; break; }

              // secondary guard: match by title
              const byTitle = nodes.find(d =>
                d.category?.name === categoryName &&
                d.title === titleTarget
              );
              if (byTitle) { discussionId = byTitle.id; break; }

              if (!page.repository.discussions.pageInfo.hasNextPage) break;
              cursor = page.repository.discussions.pageInfo.endCursor;
            }

            // 3) Create discussion if missing
            if (!discussionId) {
              core.info('No existing discussion — creating…');
              const body =
                `**Release version:** ${version}  \n` +
                `**Release date:** TODO (YYYY-MM-DD)  \n` +
                `**Status:** TODO\n\n` +
                `### Highlights\n\n` +
                `### Community contributions\n\n` +
                `### Links\n` +
                `- [Pull requests with ${labelName}](https://github.com/${owner}/${repo}/pulls?q=label%3A${encodeURIComponent(labelName)})\n`;

              const created = await github.graphql(`
                mutation($repoId:ID!, $catId:ID!, $title:String!, $body:String!){
                  createDiscussion(input:{
                    repositoryId:$repoId,
                    categoryId:$catId,
                    title:$title,
                    body:$body
                  }){ discussion{ id url } }
                }
              `, { repoId, catId: categoryId, title: titleTarget, body });

              discussionId = created.createDiscussion.discussion.id;
              core.info(`Created discussion id: ${discussionId}`);
            } else {
              core.info(`Reusing discussion id: ${discussionId}`);
            }

            // 4) Ensure repo label exists (create if missing) and get its ID
            let labelId;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (e) {
              if (e.status === 404) {
                core.info(`Label ${labelName} not found — creating…`);
                await github.rest.issues.createLabel({
                  owner, repo, name: labelName, color: '0E8A16'
                });
              } else { throw e; }
            }
            const labelNode = await github.graphql(`
              query($owner:String!, $repo:String!, $name:String!){
                repository(owner:$owner, name:$repo){ label(name:$name){ id } }
              }
            `, { owner, repo, name: labelName });
            labelId = labelNode.repository.label?.id;
            if (!labelId) {
              core.setFailed(`Could not resolve label ID for ${labelName}`);
              return;
            }

            // 5) Add label to discussion via GraphQL (needs labelIds, not names)
            await github.graphql(`
              mutation($id:ID!, $labels:[ID!]!){
                addLabelsToLabelable(input:{ labelableId:$id, labelIds:$labels }) { clientMutationId }
              }
            `, { id: discussionId, labels: [labelId] });

            core.info('✓ Done.');
