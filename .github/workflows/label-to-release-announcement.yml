name: Label → Release Discussions

on:
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]

permissions:
  contents: read
  discussions: write
  issues: write
  pull-requests: read

jobs:
  create-discussions:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure discussions exist for all release/* labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const categoryName = 'Announcements';

            // Grab labels on this issue/PR
            const prOrIssue = context.payload.issue || context.payload.pull_request;
            const releaseLabels = (prOrIssue.labels || [])
              .map(l => l.name)
              .filter(name => name.startsWith('release/'));

            if (releaseLabels.length === 0) {
              core.info('No release/* labels found, skipping.');
              return;
            }
            core.info(`Release labels: ${releaseLabels.join(', ')}`);

            // Get repo id + categories
            const repoData = await github.graphql(`
              query($owner:String!, $repo:String!){
                repository(owner:$owner, name:$repo){
                  id
                  discussionCategories(first:100){ nodes { id name } }
                }
              }
            `, { owner, repo });

            const repoId = repoData.repository.id;
            const category = repoData.repository.discussionCategories.nodes.find(c => c.name === categoryName);
            if (!category) {
              core.setFailed(`Discussion category "${categoryName}" not found`);
              return;
            }
            const categoryId = category.id;

            // For each release label → ensure a discussion exists
            for (const labelName of releaseLabels) {
              const version = labelName.substring('release/'.length);
              const titleTarget = `Release: ${version}`;
              core.info(`\n→ Processing ${labelName}`);

              // Paginate discussions to look for one
              let discussionId = null;
              let cursor = null;

              while (true) {
                const page = await github.graphql(`
                  query($owner:String!, $repo:String!, $cursor:String){
                    repository(owner:$owner, name:$repo){
                      discussions(first:50, after:$cursor){
                        nodes{
                          id
                          title
                          url
                          category{ name }
                          labels(first:50){ nodes{ name } }
                        }
                        pageInfo{ hasNextPage endCursor }
                      }
                    }
                  }
                `, { owner, repo, cursor });

                const nodes = page.repository.discussions.nodes;

                const byLabel = nodes.find(d =>
                  d.category?.name === categoryName &&
                  d.labels?.nodes?.some(l => l.name === labelName)
                );
                if (byLabel) { discussionId = byLabel.id; break; }

                const byTitle = nodes.find(d =>
                  d.category?.name === categoryName &&
                  d.title === titleTarget
                );
                if (byTitle) { discussionId = byTitle.id; break; }

                if (!page.repository.discussions.pageInfo.hasNextPage) break;
                cursor = page.repository.discussions.pageInfo.endCursor;
              }

              if (!discussionId) {
                core.info(`No discussion found for ${labelName} — creating one…`);
                const body =
                  `**Release version:** ${version}  \n` +
                  `**Release date:** TODO (YYYY-MM-DD)  \n` +
                  `**Status:** TODO\n\n` +
                  `### Links\n` +
                  `- [Issues and pull requests marked for release ${version}](https://github.com/${owner}/${repo}/pulls?q=label%3A${encodeURIComponent(labelName)})\n`;

                const created = await github.graphql(`
                  mutation($repoId:ID!, $catId:ID!, $title:String!, $body:String!){
                    createDiscussion(input:{
                      repositoryId:$repoId,
                      categoryId:$catId,
                      title:$title,
                      body:$body
                    }){ discussion{ id url } }
                  }
                `, { repoId, catId: categoryId, title: titleTarget, body });

                discussionId = created.createDiscussion.discussion.id;
                core.info(`Created discussion ${discussionId}`);
              } else {
                core.info(`Reusing existing discussion ${discussionId}`);
              }

              // Ensure repo label exists
              let labelId;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch (e) {
                if (e.status === 404) {
                  core.info(`Label ${labelName} missing — creating…`);
                  await github.rest.issues.createLabel({
                    owner, repo, name: labelName, color: '0E8A16'
                  });
                } else { throw e; }
              }
              const labelNode = await github.graphql(`
                query($owner:String!, $repo:String!, $name:String!){
                  repository(owner:$owner, name:$repo){ label(name:$name){ id } }
                }
              `, { owner, repo, name: labelName });
              labelId = labelNode.repository.label?.id;
              if (!labelId) {
                core.setFailed(`Could not resolve label ID for ${labelName}`);
                return;
              }

              // Attach label to discussion
              await github.graphql(`
                mutation($id:ID!, $labels:[ID!]!){
                  addLabelsToLabelable(input:{ labelableId:$id, labelIds:$labels }) {
                    clientMutationId
                  }
                }
              `, { id: discussionId, labels: [labelId] });

              core.info(`✓ ${labelName} attached to discussion`);
            }
